[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "go-game"
version = "0.1.0"
description = "A Python implementation of the board game Go with PyQt5 GUI"
requires-python = ">=3.9"
dependencies = [
    "PyQt5>=5.15.11",
    "numpy>=1.26.4",
]

[project.scripts]
go-game = "go_main:main"

[tool.setuptools]
py-modules = ["go_game", "go_ai", "go_gui", "go_main"]
