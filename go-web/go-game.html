<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go Game</title>
    <style>
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        .board {
            display: grid;
            background-color: #DEB887;
            padding: 20px;
            margin: 20px;
            grid-gap: 0;
        }

        .intersection {
            width: 40px;
            height: 40px;
            border-right: 1px solid black;
            border-bottom: 1px solid black;
            position: relative;
            background-color: transparent;
        }

        /* Add left border for first column */
        .intersection[data-x="0"] {
            border-left: 1px solid black;
        }

        /* Add top border for first row */
        .intersection[data-y="0"] {
            border-top: 1px solid black;
        }

        .stone {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 34px;
            height: 34px;
            border-radius: 50%;
            z-index: 1;
        }

        .black {
            background: black;
            box-shadow: 2px 2px 4px rgba(0,0,0,0.4);
        }

        .white {
            background: white;
            border: 1px solid #999;
            box-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .controls {
            margin: 20px;
            display: flex;
            gap: 10px;
        }

        button {
            padding: 8px 16px;
            border-radius: 4px;
            border: 1px solid #ccc;
            background: #fff;
            cursor: pointer;
        }

        select {
            padding: 8px;
            border-radius: 4px;
        }

        .status {
            margin: 10px;
            font-weight: bold;
        }

        .debug {
            margin: 20px;
            padding: 10px;
            background: #f5f5f5;
            border-radius: 4px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="controls">
            <select id="boardSize">
                <option value="9">9x9</option>
                <option value="13">13x13</option>
                <option value="19">19x19</option>
            </select>
            <select id="aiLevel">
                <option value="1">Beginner</option>
                <option value="2">Intermediate</option>
                <option value="3">Advanced</option>
            </select>
            <button id="passButton">Pass</button>
            <button id="resetButton">Reset</button>
            <button id="undoButton">Undo</button>
            <button id="debugButton">Debug</button>
        </div>
        <div id="status" class="status">Black's turn</div>
        <div id="board" class="board"></div>
        <div id="debug" class="debug"></div>
    </div>

    <script>
        let BOARD_SIZE = 9;
        let board = Array(BOARD_SIZE).fill().map(() => Array(BOARD_SIZE).fill(null));
        let currentPlayer = 'black';
        let gameOver = false;
        let passes = 0;
        let ko = null;
        let debugMode = false;
        let moveHistory = [];

        function createBoard() {
            const boardElement = document.getElementById('board');
            boardElement.innerHTML = '';
            boardElement.style.gridTemplateColumns = `repeat(${BOARD_SIZE}, 40px)`;
            
            for (let y = 0; y < BOARD_SIZE; y++) {
                for (let x = 0; x < BOARD_SIZE; x++) {
                    const intersection = document.createElement('div');
                    intersection.className = 'intersection';
                    intersection.dataset.x = x;
                    intersection.dataset.y = y;
                    intersection.onclick = () => makeMove(x, y);
                    boardElement.appendChild(intersection);
                }
            }
            updateBoard();
        }

        function updateBoard() {
            const intersections = document.getElementsByClassName('intersection');
            for (let y = 0; y < BOARD_SIZE; y++) {
                for (let x = 0; x < BOARD_SIZE; x++) {
                    const stone = board[y][x];
                    const intersection = intersections[y * BOARD_SIZE + x];
                    intersection.innerHTML = stone ? 
                        `<div class="stone ${stone}"></div>` : '';
                }
            }
            
            document.getElementById('status').textContent = 
                gameOver ? 'Game Over!' : `${currentPlayer}'s turn`;
        }

        function isValidPosition(x, y) {
            return x >= 0 && x < BOARD_SIZE && y >= 0 && y < BOARD_SIZE;
        }

        function getAdjacent(x, y) {
            return [[x+1, y], [x-1, y], [x, y+1], [x, y-1]]
                .filter(([nx, ny]) => isValidPosition(nx, ny));
        }

        function getGroup(x, y, color) {
            const group = new Set();
            const stack = [[x, y]];
            
            while (stack.length > 0) {
                const [cx, cy] = stack.pop();
                if (!isValidPosition(cx, cy) || board[cy][cx] !== color) continue;
                const pos = `${cx},${cy}`;
                if (group.has(pos)) continue;
                
                group.add(pos);
                getAdjacent(cx, cy).forEach(([nx, ny]) => {
                    if (board[ny][nx] === color) {
                        stack.push([nx, ny]);
                    }
                });
            }
            
            return group;
        }

        function countLiberties(group) {
            const liberties = new Set();
            for (const pos of group) {
                const [x, y] = pos.split(',').map(Number);
                getAdjacent(x, y).forEach(([nx, ny]) => {
                    if (board[ny][nx] === null) {
                        liberties.add(`${nx},${ny}`);
                    }
                });
            }
            return liberties;
        }

        function makeMove(x, y) {
            if (gameOver || board[y][x] !== null || (`${x},${y}` === ko)) return;

            // Save current state for undo
            moveHistory.push({
                board: board.map(row => [...row]),
                player: currentPlayer,
                ko: ko
            });

            board[y][x] = currentPlayer;
            const capturedGroups = [];

            // Check for captures
            getAdjacent(x, y).forEach(([nx, ny]) => {
                if (board[ny][nx] === (currentPlayer === 'black' ? 'white' : 'black')) {
                    const group = getGroup(nx, ny, board[ny][nx]);
                    if (countLiberties(group).size === 0) {
                        capturedGroups.push(group);
                    }
                }
            });

            // Remove captured stones
            let totalCaptured = 0;
            capturedGroups.forEach(group => {
                totalCaptured += group.size;
                group.forEach(pos => {
                    const [cx, cy] = pos.split(',').map(Number);
                    board[cy][cx] = null;
                });
            });

            // Check if move is suicide
            const ownGroup = getGroup(x, y, currentPlayer);
            if (countLiberties(ownGroup).size === 0 && totalCaptured === 0) {
                board[y][x] = null;
                moveHistory.pop();
                return;
            }

            // Set ko point if exactly one stone was captured
            ko = totalCaptured === 1 ? Array.from(capturedGroups[0])[0] : null;

            // Switch players
            currentPlayer = currentPlayer === 'black' ? 'white' : 'black';
            passes = 0;
            
            updateBoard();

            // AI move if it's white's turn
            if (currentPlayer === 'white') {
                setTimeout(aiMove, 500);
            }
        }

        function aiMove() {
            if (gameOver) return;

            // Simple AI: make a random legal move
            const legalMoves = [];
            for (let y = 0; y < BOARD_SIZE; y++) {
                for (let x = 0; x < BOARD_SIZE; x++) {
                    if (board[y][x] === null && `${x},${y}` !== ko) {
                        legalMoves.push([x, y]);
                    }
                }
            }

            if (legalMoves.length > 0) {
                const [x, y] = legalMoves[Math.floor(Math.random() * legalMoves.length)];
                makeMove(x, y);
            } else {
                pass();
            }
        }

        function pass() {
            passes++;
            if (passes >= 2) {
                gameOver = true;
            } else {
                currentPlayer = currentPlayer === 'black' ? 'white' : 'black';
                if (currentPlayer === 'white') {
                    setTimeout(aiMove, 500);
                }
            }
            updateBoard();
        }

        function undo() {
            if (moveHistory.length === 0) return;
            
            const lastState = moveHistory.pop();
            board = lastState.board;
            currentPlayer = lastState.player;
            ko = lastState.ko;
            passes = 0;
            gameOver = false;
            
            updateBoard();
        }

        function resetGame() {
            board = Array(BOARD_SIZE).fill().map(() => Array(BOARD_SIZE).fill(null));
            currentPlayer = 'black';
            gameOver = false;
            passes = 0;
            ko = null;
            moveHistory = [];
            createBoard();
        }

        function changeBoardSize() {
            BOARD_SIZE = parseInt(document.getElementById('boardSize').value);
            resetGame();
        }

        function toggleDebug() {
            debugMode = !debugMode;
            document.getElementById('debug').style.display = debugMode ? 'block' : 'none';
            if (debugMode) {
                document.getElementById('debug').textContent = 
                    `Board Size: ${BOARD_SIZE}x${BOARD_SIZE}, Moves: ${moveHistory.length}`;
            }
        }

        // Event Listeners
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('boardSize').addEventListener('change', changeBoardSize);
            document.getElementById('passButton').addEventListener('click', pass);
            document.getElementById('resetButton').addEventListener('click', resetGame);
            document.getElementById('undoButton').addEventListener('click', undo);
            document.getElementById('debugButton').addEventListener('click', toggleDebug);
            
            createBoard();
        });
    </script>
</body>
</html>
